<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobSeeker Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #dbeafe, #eef2ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .switch {
            margin-top: 20px;
            font-size: 14px;
        }

        .switch span {
            color: #2563eb;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 id="heading">Welcome Back!</h1>

        <p id="subtitle">Login to find your dream job</p>

        <form id="loginForm">

            <input type="text" id="name"
                   placeholder="Full Name" style="display:none;">

            <input type="email" id="email"
                   placeholder="Email Address" required>

            <input type="password" id="password"
                   placeholder="Password" required>

            <button type="submit" id="submitBtn">
                Login
            </button>

        </form>

        <p class="switch">
            <span id="switchText">Don't have an account?</span>
            <span onclick="toggleForm()" id="switchBtn">
                Sign Up
            </span>
        </p>

    </div>

    <script>
    let isSignup = window.location.search === "?signup";

    function toggleForm() {
        isSignup = !isSignup;

        document.getElementById("heading").innerText =
            isSignup ? "Create Account" : "Welcome Back!";

        document.getElementById("subtitle").innerText =
            isSignup ? "Join JobSeeker today" :
            "Login to find your dream job";

        document.getElementById("name").style.display =
            isSignup ? "block" : "none";

        document.getElementById("name").required = isSignup;

        document.getElementById("submitBtn").innerText =
            isSignup ? "Sign Up" : "Login";

        document.getElementById("switchText").innerText =
            isSignup ? "Already have an account?" :
            "Don't have an account?";

        document.getElementById("switchBtn").innerText =
            isSignup ? "Login" : "Sign Up";
    }

    document.getElementById("loginForm")
    .addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (isSignup) {
            const name = document.getElementById("name").value;

            try {
                const response = await fetch(
                    "https://jobseekerportal-api.onrender.com/api/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    alert("Account created successfully!");
                    document.getElementById("loginForm").reset();
                    window.location.href = "login.html";
                } else {
                    alert(data.message || "Registration failed");
                }

            } catch (error) {
                alert("Server connection failed. Please try again.");
                console.log(error);
            }

        } else {
    try {
        const response = await fetch(
            "https://jobseekerportal-api.onrender.com/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (response.ok) {
    localStorage.setItem("userName", data.user.name);
    localStorage.setItem("userId", data.user.id);

    alert("Login successful!");

    window.location.href = "dashboard.html";
} else {
            alert(data.message || "Login failed");
        }

    } catch (error) {
        console.log("Login Error:", error);
        alert("Server connection failed. Please try again.");
    }
}
    });

    if (isSignup) {
        toggleForm();
    }
</script>
</body>
</html>
